<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h2>Bienvenido de nuevo</h2>
            <p>Inicia sesión para continuar</p>
        </div>

        <form (ngSubmit)="login()" class="login-form">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <div class="input-wrapper">
                    <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="tu@correo.com"
                        required />
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••"
                        required />
                </div>
            </div>

            <button type="submit" class="btn-submit">
                Entrar
            </button>
        </form>

        <div class="login-footer">
            <p>¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
        </div>
    </div>
</div>
