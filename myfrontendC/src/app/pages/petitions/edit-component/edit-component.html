<div class="form-container">
    <h2>Editar Petición</h2>
    <form [formGroup]="petitionForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="title">Título de la Petición</label>
            <input id="title" type="text" formControlName="title" placeholder="¿Qué quieres cambiar?" />
        </div>
        <div class="form-group">
            <label for="description">Descripción</label>
            <textarea id="description" formControlName="description" rows="5"
                placeholder="Explica el problema y tu solución..."></textarea>
        </div>

        @if (existingImages().length > 0) {
        <div class="form-group">
            <p>Imágenes actuales (haz clic en ✕ para eliminar al guardar):</p>
            <div class="image-previews">
                @for (img of existingImages(); track img.id) {
                <div class="preview-item" [class.marked-delete]="isMarkedForDelete(img.id)">
                    <img [src]="'http://localhost:8000/storage/' + img.path" alt="Imagen de la petición" />
                    <button type="button" class="remove-btn" (click)="toggleDeleteImage(img.id)">
                        {{ isMarkedForDelete(img.id) ? '↩' : '✕' }}
                    </button>
                </div>
                }
            </div>
        </div>
        }

        <div class="form-group">
            <label for="images">Añadir más imágenes (Opcional)</label>
            <input type="file" id="images" (change)="onFileSelected($event)" accept="image/*" multiple />
        </div>

        @if (previewUrls().length > 0) {
        <div class="image-previews">
            @for (url of previewUrls(); track url; let i = $index) {
            <div class="preview-item">
                <img [src]="url" alt="Nueva imagen" />
                <button type="button" class="remove-btn" (click)="removeNewFile(i)">✕</button>
            </div>
            }
        </div>
        }

        <button type="submit" [disabled]="petitionForm.invalid">
            Actualizar Petición
        </button>
    </form>
</div>
